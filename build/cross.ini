[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
pkg-config = ['pkg-config', '--static']
[built-in options]
c_args = ['-O2', '-pthread', '-matomics', '-mbulk-memory', '-Wno-error=unused-command-line-argument', '-Wno-error=incompatible-function-pointer-types', '-Wno-error=incompatible-pointer-types']
c_link_args = ['-L/opt/wasm/lib', '-pthread', '-sALLOW_TABLE_GROWTH', '-sWASM_BIGINT']
