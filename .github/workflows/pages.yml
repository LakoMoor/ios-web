name: Verify and deploy Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/config.test.mjs
      - run: node tests/host.test.mjs
      - run: node scripts/build.mjs --require-runtime
      - name: Verify real ARM64 and storage in project Pages
        run: |
          python3 scripts/serve.py --pages > /tmp/ios-web-server.log 2>&1 &
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())")"
          node tests/storage-browser.mjs
          node tests/browser.mjs --capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-verification
          path: artifacts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
